name: Listening Log → GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "pocketcasts-history/**"
      - ".github/workflows/listening-log-pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: listening-log-github-pages
  cancel-in-progress: false

jobs:
  # Keep explorer on gh-pages next to podcast feeds (jsDelivr / branch browse).
  publish-gh-pages-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout existing gh-pages
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-prev
          fetch-depth: 1

      - name: Stage site tree
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          if [ -d gh-pages-prev ]; then
            cp -a gh-pages-prev/. site/
            rm -rf site/.git
          fi
          rm -rf site/pocketcasts-history
          mkdir -p site/pocketcasts-history
          cp -a docs/. site/pocketcasts-history/
          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<meta charset="utf-8" />' \
            '<meta http-equiv="refresh" content="0; url=./pocketcasts-history/" />' \
            '<title>rss-feeds</title>' \
            '<p><a href="./pocketcasts-history/">Listening Log</a></p>' \
            > site/index.html
          touch site/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

  # Official GitHub Pages site: https://wlad-c.github.io/rss-feeds/
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build pages artifact
        run: |
          set -euo pipefail
          rm -rf pages-dist
          mkdir -p pages-dist
          cp -a docs/. pages-dist/
          touch pages-dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - id: deployment
        uses: actions/deploy-pages@v4
