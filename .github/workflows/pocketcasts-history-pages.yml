name: Pocket Casts history → GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pocketcasts-history/**"
      - ".github/workflows/pocketcasts-history-pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pocketcasts-history-pages
  cancel-in-progress: false

jobs:
  # Keep a copy on the gh-pages branch (feed siblings + repo browse).
  publish-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout existing gh-pages (preserve siblings)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-prev
          fetch-depth: 1

      - name: Stage site tree
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          if [ -d gh-pages-prev ]; then
            cp -a gh-pages-prev/. site/
            rm -rf site/.git
          fi
          rm -rf site/pocketcasts-history
          cp -a pocketcasts-history site/pocketcasts-history
          # Root landing points at the Listening Log
          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<meta charset="utf-8" />' \
            '<title>rss-feeds</title>' \
            '<meta http-equiv="refresh" content="0; url=./pocketcasts-history/" />' \
            '<p><a href="./pocketcasts-history/">Listening Log</a></p>' \
            > site/index.html
          touch site/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

  # Best-effort GitHub Pages publish. The Cursor/GitHub App token cannot create
  # a Pages site (403), so this job is non-blocking; the explorer remains fully
  # usable from the repo via listening-log-standalone.html.
  deploy-pages:
    runs-on: ubuntu-latest
    needs: publish-branch
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages artifact tree
        run: |
          set -euo pipefail
          rm -rf pages-dist
          mkdir -p pages-dist
          cp -a pocketcasts-history pages-dist/pocketcasts-history
          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<meta charset="utf-8" />' \
            '<title>rss-feeds</title>' \
            '<meta http-equiv="refresh" content="0; url=./pocketcasts-history/" />' \
            '<p><a href="./pocketcasts-history/">Open Listening Log</a></p>' \
            > pages-dist/index.html
          touch pages-dist/.nojekyll

      - name: Setup Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
