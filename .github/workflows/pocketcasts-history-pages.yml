name: Pocket Casts history → GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pocketcasts-history/**"
      - ".github/workflows/pocketcasts-history-pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pocketcasts-history-pages
  cancel-in-progress: false

jobs:
  # Keep a copy on the gh-pages branch for CDN / sibling preservation.
  publish-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout existing gh-pages (preserve siblings)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-prev
          fetch-depth: 1

      - name: Stage site tree
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          if [ -d gh-pages-prev ]; then
            cp -a gh-pages-prev/. site/
            rm -rf site/.git
          fi
          rm -rf site/pocketcasts-history
          cp -a pocketcasts-history site/pocketcasts-history
          touch site/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

  # Official Actions-based Pages deploy (works when Pages source = GitHub Actions).
  deploy-pages:
    runs-on: ubuntu-latest
    needs: publish-branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pocketcasts-history

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
