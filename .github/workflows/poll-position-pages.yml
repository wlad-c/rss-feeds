name: Poll Position → GitHub Pages branch

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "poll-position/**"
      - "requirements.txt"
      - ".github/workflows/poll-position-pages.yml"

# Publishes static feed to the gh-pages branch. The public podcast URL is the
# jsDelivr CDN mirror (no GitHub Pages site enablement required):
#   https://cdn.jsdelivr.net/gh/wlad-c/rss-feeds@gh-pages/rss.xml
permissions:
  contents: write

concurrency:
  group: poll-position-gh-pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Restore media cache
        uses: actions/cache@v4
        with:
          path: data/media
          key: poll-position-media-${{ github.run_id }}
          restore-keys: |
            poll-position-media-

      - name: Sync episodes and build static site
        env:
          PUBLIC_BASE_URL: https://cdn.jsdelivr.net/gh/wlad-c/rss-feeds@gh-pages
          DATA_DIR: ${{ github.workspace }}/data
          SITE_DIR: ${{ github.workspace }}/site
          PYTHONPATH: ${{ github.workspace }}/poll-position
        run: python poll-position/sync.py --publish

      # force_orphan rebuilds gh-pages from ./site only — preserve sibling feeds
      # (e.g. mano-a-mano/) that other workflows publish into the same branch.
      - name: Checkout existing gh-pages (for sibling feeds)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-prev
          fetch-depth: 1

      - name: Preserve sibling feeds from existing gh-pages
        run: |
          set -euo pipefail
          if [ -d gh-pages-prev ]; then
            for dir in mano-a-mano; do
              if [ -d "gh-pages-prev/${dir}" ]; then
                rm -rf "./site/${dir}"
                cp -a "gh-pages-prev/${dir}" "./site/${dir}"
                echo "Preserved ${dir}/ from existing gh-pages"
              fi
            done
          else
            echo "No existing gh-pages checkout — nothing to preserve"
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
