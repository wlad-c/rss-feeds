name: Enable GitHub Pages (bootstrap)

# One-shot / on-demand: publish the already-built gh-pages tree via the
# official Actions Pages deploy so the site is enabled without Settings clicks.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enable-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: enable-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout gh-pages content
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
